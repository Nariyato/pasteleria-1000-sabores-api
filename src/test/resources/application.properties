# Configuracion de las pruebas: H2 en memoria, no se necesita MySQL
spring.application.name=pasteleria-api
spring.datasource.url=jdbc:h2:mem:pasteleria_test;MODE=MySQL;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

jwt.secret=clave-de-pruebas-pasteleria-1000-sabores-minimo-32-chars
jwt.access-minutos=30
jwt.refresh-dias=7
