spring.application.name=pasteleria-api
server.port=8089

# Base de datos MySQL (cada valor se puede cambiar con una variable de entorno)
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/pasteleria?createDatabaseIfNotExist=true&serverTimezone=America/Santiago&useSSL=false&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USER:root}
spring.datasource.password=${DB_PASSWORD:root}

# JPA: crea y actualiza las tablas a partir de las entidades
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# JWT: la clave es fija (si fuera aleatoria, cada reinicio invalidaría todos los tokens). En producción va por variable de entorno.
jwt.secret=${JWT_SECRET:clave-de-desarrollo-pasteleria-1000-sabores-no-usar-en-produccion}
jwt.access-minutos=30
jwt.refresh-dias=7
